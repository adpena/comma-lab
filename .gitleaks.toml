# gitleaks config for the auto-push hygiene gate (tools/auto_push_main.py — third deterministic layer).
#
# useDefault=true inherits gitleaks' curated ruleset (AWS / GitHub / Slack / OpenAI / private-key /
# generic-api-key / hundreds more). We ADD one rule the default set lacks — the Tailscale CGNAT fleet-IP
# range (private infrastructure, not a classical secret) — and ALLOWLIST the files that legitimately carry
# secret PATTERNS + secret-SHAPED fixtures by design (the scanner, its tests, and this config itself), the
# same self-reference exclusion the scanner's regex uses. MEASURED 2026-07-09: default rules over the last
# 40 commits (482 KB) flagged ZERO false-positives on our sha256 provenance — the only hit was the test
# fixture below, which this allowlist excludes — so gitleaks is precise enough to HOLD a push authoritatively.
title = "comma-lab auto-push hygiene gate"

[extend]
useDefault = true

[[rules]]
id = "tailscale-cgnat-fleet-ip"
description = "Tailscale CGNAT fleet IP (100.64.0.0/10) — private infrastructure, must never reach a public remote"
# NON-capturing groups are load-bearing (fixed 2026-07-31): with capturing `(...)`, gitleaks
# reports Secret as the GROUP — a real fleet-IP leak surfaced to the operator as
# `secret='101'`, unreadable and easy to dismiss as noise. `(?:...)` makes the finding report
# the whole IP. Verified by control: 100.101.102.103 now reports as the full address.
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
tags = ["fleet", "infra-ip", "tailscale"]

[allowlist]
description = "Files that legitimately contain secret patterns + secret-shaped fixtures by design (the scanner, its tests, this config)."
paths = [
    '''tools/auto_push_main\.py''',
    '''src/tac/tests/test_auto_push_main\.py''',
    '''\.gitleaks\.toml''',
]
# Surgical secret-value exemptions: benign prose tokens that the generic-api-key
# rule mis-matches as slash-delimited keys. These exempt ONLY the exact matched
# string — every file stays fully scanned by the fleet-IP rule and all others.
regexes = [
    # research-memo prose ("no optimizer/RNG/live/EMA state") — not a credential;
    # held the 2026-07-18 campaign-review push as generic-api-key:236 (verified benign).
    '''optimizer/RNG/live/EMA''',
    # File-custody digests in measurement/research JSONs (checkpoint_sha256, gt_cache_sha256,
    # upstream_source_sha256, git_head) — SHA-256/git integrity hashes, NOT credentials. The
    # generic-api-key entropy rule mis-matches 64/40-hex digests. Length-anchored so ONLY exact
    # SHA-256 (64-hex) and git (40-hex) shapes are exempt; the Tailscale fleet-IP rule + every
    # other rule still fire on these files. Held the 2026-07-18 completeness-coupling push.
    '''\b[0-9a-f]{64}\b''',
    '''\b[0-9a-f]{40}\b''',
    # CLASS fix (2026-07-31), not another one-off: our memo/arm/task slug vocabulary is pure
    # lowercase snake_case ("ddm_sc2_schedule_optimality_convocation_", "qa43_tail_pose"), and
    # our DOMAIN vocabulary is *token* grid / *token* stream / solve-init *tokens* — so a slug
    # sitting next to a key containing "token" trips generic-api-key's entropy heuristic
    # PERMANENTLY, not incidentally. Held the 2026-07-31 rx1 push (hand-verified benign:
    # test_ddm_co8_costate_organ_round8.py:125, entropy 3.975, no credential, no IP).
    # SCOPE: anchored, so ONLY strings that are ENTIRELY lowercase snake_case are exempt, and
    # at least one underscore is REQUIRED — an unbroken lowercase-hex/base32 key (the actual
    # generic-api-key target shape) still fires. Every high-precision prefix rule (AKIA… /
    # ghp_… / xoxb-… / sk-… / -----BEGIN PRIVATE KEY) and the Tailscale fleet-IP rule above
    # are UNAFFECTED on these files. Narrowing one entropy heuristic, never a detector.
    '''^[a-z][a-z0-9]*(_[a-z0-9]+)+_?$''',
    # CUSTODY-ASSERTION shape (2026-08-17). `require_file(path, expect_bytes=FRAMES * ...)`
    # and its `expect_sha=` sibling are OUR standard file-custody signature — the
    # ALWAYS-KEEP-THE-PAYLOAD contract in code — so they appear in every arm that pins a
    # payload. generic-api-key reports the Secret as `expect_bytes=FRAMES`: an identifier,
    # an `=`, and a bare ALL-CAPS Python CONSTANT NAME. Held the 2026-08-17 sf1 push
    # (hand-verified benign: experiments/ddm_sf1_semantic_film_pose_map.py:520, entropy
    # 3.892, a byte-count assertion, no credential and no IP).
    # SCOPE, deliberately tight: the kwarg NAME is anchored to expect_bytes/expect_sha, so
    # this can never exempt `api_key=…` / `token=…` / `secret=…`. The general shape
    # `<ident>=<ALLCAPS>` was CONSIDERED AND REJECTED — an AWS key IS `[A-Z][A-Z0-9]*`, so
    # it would have exempted `api_key=AKIA…`, and the top-level allowlist applies to EVERY
    # rule, including the high-precision AWS/GitHub/Slack prefix rules.
    # POSITIVE CONTROL, EXECUTED (differential, with-entry vs without-entry): both configs
    # report the SAME 3 findings — a realistic AWS key (`AKIA5T7QZR3XK9WLMN24`,
    # generic-api-key), a GitHub PAT (`ghp_…`, github-pat), and a fleet IP
    # (`100.101.102.103`, tailscale-cgnat-fleet-ip). `api_key=AKIA5T7QZR3XK9WLMN24` still
    # fires. Only `expect_bytes=FRAMES` goes silent. This entry changes detection of
    # nothing else.
    # ⚠ CONTROL-DESIGN NOTE, learned the hard way here TWICE (2026-08-17):
    # (1) Do NOT use `AKIAIOSFODNN7EXAMPLE` as the planted key. It is gitleaks' own
    #     documentation example and the DEFAULT ruleset allowlists it, so it is silent with
    #     or without any entry of ours — a control that cannot fail, which proves nothing.
    #     A vacuous falsifier reads as a pass. Plant a realistic non-canonical key instead.
    # (2) …and DO NOT COMMIT THE PLANTED LITERAL. Clause (1) alone is incomplete guidance:
    #     a sister arm followed it exactly, committed the realistic key inside its audit
    #     memo's results table, and the auto-push hygiene gate correctly HELD the push.
    #     The gate is not a false positive — a scanner cannot distinguish a documented
    #     fixture from a live credential and must not try, and an AWS-shaped literal in a
    #     public repo trips GitHub secret scanning regardless of whether it unlocks
    #     anything. CONTRACT: run the control with a realistic key, record the VERDICT,
    #     commit a SHAPE DESCRIPTION ("realistic non-canonical AWS-shaped key, 20 chars,
    #     AKIA-prefixed") — never the characters. Keep the key in the scratch dir only.
    #     Genus: an instruction correct about the MEASUREMENT and silent about the ARTIFACT.
    '''^expect_(?:bytes|sha)=[A-Z][A-Z0-9_]*$''',
]
